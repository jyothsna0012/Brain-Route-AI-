<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainRoute AI</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 600px;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        color: #0f62fe;
      }

      p {
        color: #555;
        line-height: 1.7;
        font-size: 18px;
      }

      button {
        margin-top: 25px;
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #0f62fe;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #0043ce;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>BrainRoute AI</h1>

      <p>
        AI-powered personalized learning assistant developed using IBM watsonx
        Orchestrate and IBM Granite models. It generates personalized career
        pathways, skill roadmaps, course recommendations, and project guidance
        for students.
      </p>

      <button onclick="showDemo()">Open Live AI Demo</button>
    </div>

    <script>
      function showDemo() {
        window.open(
          "https://us-south.watson-orchestrate.cloud.ibm.com",
          "_blank",
        );
      }
    </script>
  </body>
</html>
